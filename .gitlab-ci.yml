stages:
  - lint
  - build
  - test

# 全局缓存：让各个 job 共享 node_modules，避免每次从零下载
cache:
  paths:
    - frontend/node_modules/


# ============================================
# 阶段 1: 代码检查
# ============================================
lint-backend:
  stage: lint
  script:
    - cd backend
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -q ruff
    - ruff check app/ --select=F821,F822,F823 --ignore=I
  tags:
    - shell
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH != "main"

lint-frontend:
  stage: lint
  timeout: 20m 
  script:
    - cd frontend
    - npm ci
    - npm run lint
  tags:
    - shell
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH != "main"

# ============================================
# 阶段 2: 构建
# ============================================
build-frontend:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npx vite build
  tags:
    - shell
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH != "main"

# ============================================
# 阶段 3: 测试
# ============================================
test-backend:
  stage: test
  script:
    - cd backend
    - apt-get update -qq && apt-get install -y -qq fluidsynth > /dev/null 2>&1
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
    - python3 -m pytest tests/ -v --tb=short
  tags:
    - shell
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH != "main"
