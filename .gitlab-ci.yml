stages:
  - lint
  - build
  - test

# 全局缓存
cache:
  paths:
    - frontend/node_modules/
    - .cache/pip/


# ============================================
# 阶段 1: 代码检查
# ============================================
lint-backend:
  stage: lint
  script:
    - cd backend
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -q ruff
    - ruff check app/ --select=F821,F822,F823 --ignore=I
  tags:
    - shell

lint-frontend:
  stage: lint
  timeout: 20m 
  script:
    - cd frontend
    - npm ci
    - npm run lint
  tags:
    - shell

# ============================================
# 阶段 2: 构建
# ============================================
build-backend:
  stage: build
  script:
    - cd backend
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --upgrade pip setuptools wheel build
    - python3 -m build --sdist --wheel -o dist
  artifacts:
    paths:
      - backend/dist/
    expire_in: 1 week
  tags:
    - shell

build-frontend:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npx vite build
  tags:
    - shell

# ============================================
# 阶段 3: 测试
# ============================================
test-backend:
  stage: test
  script:
    - cd backend
    - apt-get update -qq && apt-get install -y -qq fluidsynth > /dev/null 2>&1
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
    - python3 -m pytest tests/ -v --tb=short
  tags:
    - shell